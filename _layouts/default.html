<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="shell nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>{{ site.title }}</span>
        </a>
        <nav aria-label="주요 메뉴">
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Archive</a>
          <a href="#about">About</a>
        </nav>
      </div>
    </header>

    <main class="shell">
      {{ content }}
    </main>

    <footer class="shell site-footer" id="about">
      <p>© {{ 'now' | date: '%Y' }} Antiene. Built slowly, shared openly.</p>
    </footer>
  </body>
</html>
