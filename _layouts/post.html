---
layout: default
---
<article class="post">
  <p class="post-meta">{{ page.date | date: '%Y. %m. %d' }} · {{ page.categories | join: ', ' }}{% if page.notion_source %} · <a href="{{ page.notion_source }}">Notion 원본</a>{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <div class="post-content">{{ content }}</div>
</article>
